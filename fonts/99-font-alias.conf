<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  字体替换映射（内网文档预览用）

  为什么需要它：
  LibreOffice 转码时若找不到文档里指定的字体，会按 fontconfig 的默认规则
  随便挑一个，常常挑到风格完全不同的字体，导致字宽变化 -> 换行、对齐、
  分页全错位。下面把常见的 Word 默认字体显式映射到「度量最接近」的可用字体。

  Calibri -> Carlito：度量完全兼容（Carlito 就是为替代 Calibri 设计的，SIL OFL）
  DengXian/等线 -> Microsoft YaHei：同为现代无衬线黑体，字面基本一致
-->
<fontconfig>

  <!-- Word 默认西文字体 -->
  <alias binding="same">
    <family>Calibri</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="same">
    <family>Calibri Light</family>
    <prefer><family>Carlito</family></prefer>
  </alias>
  <alias binding="same">
    <family>Cambria</family>
    <prefer><family>Caladea</family></prefer>
  </alias>

  <!--
    Office 2016+ 默认中文字体「等线」。
    【重要】不要映射到微软雅黑！
    实测行高/字号：等线 1.05、黑体 1.01、微软雅黑 1.33。
    映射到雅黑会让每行高 27%，整段文字被撑开，看起来像"字体变大、行距变松"。
    黑体的行高与等线接近，且同为无衬线，是更好的替代。
  -->
  <alias binding="same">
    <family>DengXian</family>
    <prefer><family>SimHei</family></prefer>
  </alias>
  <alias binding="same">
    <family>等线</family>
    <prefer><family>SimHei</family></prefer>
  </alias>
  <alias binding="same">
    <family>等线 Light</family>
    <prefer><family>SimHei</family></prefer>
  </alias>
  <alias binding="same">
    <family>DengXian Light</family>
    <prefer><family>SimHei</family></prefer>
  </alias>

  <!-- 常见别名归一 -->
  <alias binding="same">
    <family>宋体</family>
    <prefer><family>SimSun</family></prefer>
  </alias>
  <alias binding="same">
    <family>仿宋_GB2312</family>
    <prefer><family>FangSong</family></prefer>
  </alias>
  <alias binding="same">
    <family>楷体_GB2312</family>
    <prefer><family>KaiTi</family></prefer>
  </alias>

  <!-- 西文常见替代，避免落到中文字体上 -->
  <alias binding="same">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>

  <!--
    Windows 界面/Office 常用西文字体。
    这些字体在容器里没有，fontconfig 会兜底到「文泉驿正黑」——那是中文黑体，
    西文字形和字宽完全不同，会让整段西文错位。必须显式指到西文字体。
  -->
  <alias binding="same">
    <family>Segoe UI</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Segoe UI Light</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Verdana</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Tahoma</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Trebuchet MS</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Georgia</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Garamond</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Constantia</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Cambria Math</family>
    <prefer><family>DejaVu Serif</family><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Symbol</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Consolas</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>Courier New</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>

  <!--
    思源系列与国产字体。
    注意「思源宋体」必须落衬线体：之前落到文泉驿正黑，整篇宋体变黑体。
  -->
  <alias binding="same">
    <family>思源黑体</family>
    <prefer><family>SimHei</family></prefer>
  </alias>
  <alias binding="same">
    <family>Source Han Sans SC</family>
    <prefer><family>SimHei</family></prefer>
  </alias>
  <alias binding="same">
    <family>Noto Sans CJK SC</family>
    <prefer><family>SimHei</family></prefer>
  </alias>
  <alias binding="same">
    <family>思源宋体</family>
    <prefer><family>SimSun</family></prefer>
  </alias>
  <alias binding="same">
    <family>Source Han Serif SC</family>
    <prefer><family>SimSun</family></prefer>
  </alias>
  <alias binding="same">
    <family>Noto Serif CJK SC</family>
    <prefer><family>SimSun</family></prefer>
  </alias>
  <alias binding="same">
    <family>方正兰亭黑</family>
    <prefer><family>SimHei</family></prefer>
  </alias>
  <alias binding="same">
    <family>汉仪旗黑</family>
    <prefer><family>SimHei</family></prefer>
  </alias>

</fontconfig>
