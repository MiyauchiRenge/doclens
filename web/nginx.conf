server {
    listen 80;
    server_name _;

    # 老格式与扫描件可能较大
    client_max_body_size 256m;
    client_body_timeout 300s;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # ---------------------------------------------------------------------
    # 前端静态资源：三个文件，精确匹配，优先于下面的兜底规则
    # ---------------------------------------------------------------------
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location = /app.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location = /style.css {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    # 浏览器自动请求的资源：直接返回空响应。
    # 若不拦截，它们会落入 @kk_fallback 被转发给 kkFileView，
    # 在 kkFileView 未就绪时表现为 favicon.ico 502，干扰排障。
    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location = /robots.txt {
        access_log off;
        return 204;
    }

    # ---------------------------------------------------------------------
    # portal API
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://portal:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------------------------------------------------------------------
    # kkFileView 预览入口
    #   /preview/onlinePreview -> kkfileview:8012/onlinePreview
    #
    # 注意 Host 必须用 $http_host（带端口），不能用 $host（只有主机名）。
    # kkFileView 会用 Host 头拼出转码后的图片绝对地址，例如
    #   http://127.0.0.1/<文件夹>/0.jpg
    # 一旦丢了端口，浏览器就会去连 80，DOCX/XLSX 预览表现为一直 loading。
    # ---------------------------------------------------------------------
    location /preview/ {
        proxy_pass http://kkfileview:8012/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 600s;
    }

    # ---------------------------------------------------------------------
    # 兜底：静态目录里没有的路径一律转给 kkFileView
    #
    # 原因：kkFileView 的预览页会以绝对路径引用自己的资源（/js/、/css/ 等），
    # 并可能回调自己的接口。逐个枚举前缀不可靠，用兜底转发对未知路径更稳。
    # 本服务静态资源只有上面三个文件，不存在与业务路径冲突的风险。
    # ---------------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @kk_fallback;
    }

    location @kk_fallback {
        proxy_pass http://kkfileview:8012;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 600s;
    }
}
