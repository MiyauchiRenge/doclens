<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内网文件预览</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>内网文件预览</h1>
  <p class="sub">支持 PDF / OFD / Office / 图片 等格式的在线预览与 PDF 转 Word</p>
</header>

<main>
  <section id="drop" class="drop" tabindex="0" role="button" aria-label="选择或拖入文件">
    <div class="drop-icon">+</div>
    <p class="drop-main">拖入文件，或点击选择</p>
    <p class="drop-hint">单文件上传 · 支持范围见页脚</p>
    <input id="picker" type="file" hidden>
  </section>

  <section id="panel" class="panel hidden">
    <div class="meta">
      <span id="fname" class="fname"></span>
      <span id="fsize" class="fsize"></span>
    </div>

    <div class="actions">
      <button id="btnPreview" class="btn primary">预览</button>
      <button id="btnConvert" class="btn hidden">转 Word</button>
      <button id="btnOcr" class="btn hidden">OCR 提取文字（无格式）</button>
      <button id="btnOcrPdf" class="btn hidden">OCR 生成可搜索 PDF</button>
      <button id="btnPdf" class="btn hidden">转 PDF</button>
      <button id="btnClose" class="btn danger">关闭并清理</button>
    </div>

    <p id="status" class="status"></p>

    <div id="viewer" class="viewer hidden">
      <iframe id="frame" title="预览"></iframe>
      <img id="image" alt="预览" class="hidden">
      <div id="ofdHost" class="ofd-host hidden"></div>
    </div>
  </section>
</main>

<footer>
  <p>文件仅在处理期间临时驻留于内存盘，会话结束或超时后自动销毁；页面关闭即触发清理。</p>
  <p class="muted">支持：PDF、OFD、DOC/DOCX、XLS/XLSX、PPT/PPTX、WPS、RTF、图片、文本、音视频、压缩包等</p>
</footer>

<script src="/app.js"></script>
</body>
</html>
