<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="renderer" content="webkit">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocLens · 内网文档预览</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="browserWarn" class="browser-warn hidden">
  检测到 360 / QQ 等双核浏览器。这类浏览器的扩展可能拦截文件选择，导致点击后没有反应。
  建议改用 <b>Chrome</b>、<b>Edge</b>、<b>Firefox</b> 或 <b>奇安信浏览器</b>。
</div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">DL</div>
      <div class="brand-text">
        <h1>DocLens</h1>
        <p>内网文档预览与转换</p>
      </div>
    </div>
    <div class="topmeta">
      <span class="pill">PDF</span>
      <span class="pill">OFD</span>
      <span class="pill">Office</span>
      <span class="pill">OCR</span>
    </div>
  </header>

  <main class="main">
    <label id="drop" class="drop" for="picker" tabindex="0" aria-label="选择或拖入文件">
      <div class="drop-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4m0 0L7 9m5-5 5 5"></path>
          <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
        </svg>
      </div>
      <p class="drop-main">拖入文件，或点击选择</p>
      <p class="drop-hint">单文件 · 不超过 200 MB · 会话结束自动清理</p>
      <input id="picker" type="file" class="sr-only">
    </label>

    <section id="panel" class="panel hidden">
      <div class="filehead">
        <span id="fileBadge" class="badge b-def">FILE</span>
        <div class="filemeta">
          <span id="fname" class="fname"></span>
          <span id="fsize" class="fsize"></span>
        </div>
      </div>

      <div class="actions">
        <button id="btnPreview" class="btn primary">预览</button>
        <button id="btnConvert" class="btn hidden">转 Word</button>
        <button id="btnOcr" class="btn hidden">OCR 提取文字</button>
        <button id="btnOcrPdf" class="btn hidden">OCR 可搜索 PDF</button>
        <button id="btnPdf" class="btn hidden">转 PDF</button>
        <button id="btnClose" class="btn ghost">关闭并清理</button>
      </div>

      <p id="status" class="status"></p>

      <div id="viewer" class="viewer hidden">
        <iframe id="frame" title="预览"></iframe>
        <img id="image" alt="预览" class="hidden">
        <div id="ofdHost" class="ofd-host hidden"></div>
        <div id="archiveHost" class="archive-host hidden"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="privacy">文件仅在处理期间临时驻留于内存盘，会话结束或超时后自动销毁；关闭页面即触发清理。</p>
    <p class="formats">支持 PDF、OFD、Word/Excel/PPT（含 WPS 与 ODF）、图片与 TIFF、文本与代码、音视频、压缩包</p>
  </footer>
</div>

<script src="/app.js"></script>
</body>
</html>
