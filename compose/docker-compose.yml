version: "3.8"

services:
  # -------------------------------------------------------------------------
  # 入口：静态前端 + 路由（/api -> portal，/preview -> kkFileView）
  # -------------------------------------------------------------------------
  nginx:
    image: ${NGINX_IMAGE:-nginx}:${NGINX_VERSION:-1.27-alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      # 路径相对 compose 目录：部署目录布局为 <root>/{compose,web,fonts}
      # 带 z 标签，兼容 openEuler/麒麟 上 SELinux=Enforcing 的情况
      - ../web/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ../web/html:/usr/share/nginx/html:ro,z
    depends_on:
      - portal
      - kkfileview
    networks:
      - fileview
    tmpfs:
      - /var/cache/nginx
      - /var/run

  # -------------------------------------------------------------------------
  # 业务服务：上传、预览路由、PDF转Word、一次性下载、TTL 清理
  # /data 挂 tmpfs —— 容器停止即消失，物理上不落持久盘
  # -------------------------------------------------------------------------
  portal:
    image: ${PORTAL_IMAGE:-fileview/portal}:${PORTAL_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SESSION_TTL: "${SESSION_TTL:-1800}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-200}"
      CONVERT_TIMEOUT: "${CONVERT_TIMEOUT:-300}"
      CONVERT_CONCURRENCY: "${CONVERT_CONCURRENCY:-1}"
      OCR_TIMEOUT: "${OCR_TIMEOUT:-1800}"
      OCR_CONCURRENCY: "${OCR_CONCURRENCY:-1}"
      KKFILEVIEW_URL: http://kkfileview:8012
      SELF_URL: http://portal:8000
      TZ: Asia/Shanghai
    expose:
      - "8000"
    networks:
      - fileview
    tmpfs:
      - /data:size=${TMPFS_SIZE:-2g},mode=1777
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # -------------------------------------------------------------------------
  # 转码服务：老格式 .doc/.xls/.ppt 与复杂 Office 由 LibreOffice 转 PDF
  # -------------------------------------------------------------------------
  kkfileview:
    image: ${KK_IMAGE:-keking/kkfileview}:${KK_VERSION:-4.1.0}
    restart: unless-stopped
    # 容器内 JVM 是 PID 1，不回收子进程会残留僵尸 soffice，
    # 导致 jodconverter 报 "started but its pid could not be found"。
    # init: true 让 tini 当 PID 1 负责回收。
    init: true
    # LibreOffice 依赖 /dev/shm，默认 64MB 容易在转换大文档时失败
    shm_size: 256m
    environment:
      TZ: Asia/Shanghai
      # Office 预览方式：
      #   image（默认，已验证）：每页转 JPEG，渲染稳定，但放大略糊、文字不可选中
      #   pdf（实验）：矢量可选中，但在本环境实测 pdf.js 显示 0/0，未通过验证
      # 切 pdf 前请自行实测，别直接上生产。
      KK_OFFICE_PREVIEW_TYPE: "${KK_OFFICE_PREVIEW_TYPE:-image}"
      # 小内存宿主上必须限制堆：JVM 默认按物理内存推算，3~4G 机器上会和
      # LibreOffice 进程抢内存。JAVA_TOOL_OPTIONS 无需改镜像入口即可生效。
      JAVA_TOOL_OPTIONS: "${KK_JAVA_OPTS:--Xms128m -Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC}"
    volumes:
      # 中文字体挂到 custom 子目录，避免覆盖镜像自带字体
      - ../fonts:/usr/share/fonts/truetype/custom:ro,z
      # 字体替换映射：只挂单个文件，不动镜像自带的其它 fontconfig 配置
      - ../fonts/99-font-alias.conf:/etc/fonts/conf.d/99-font-alias.conf:ro,z
    expose:
      - "8012"
    networks:
      - fileview
    tmpfs:
      - /tmp:size=512m
      # kkFileView 会把转码得到的 PDF/图片落在自己安装目录的 file/ 下，
      # 默认是容器可写层（重启才清）。挂 tmpfs 才能随容器销毁即消失。
      - /opt/kkFileView-4.1.0/file:size=1g
    ulimits:
      # 关键：宿主 nr_open 常见为 1073741816，Docker 会原样继承。
      # Java 8 按 RLIMIT_NOFILE 预分配 fd 表，上限过大直接
      # "unable to allocate file descriptor table - out of memory" 崩溃重启。
      nofile:
        soft: 65535
        hard: 65535

networks:
  fileview:
    driver: bridge
